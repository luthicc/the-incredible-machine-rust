name: Release

# Push a tag like v1.0.0 to build every platform, publish a GitHub release
# and deploy the browser player to GitHub Pages.
# Running the workflow manually builds the same packages as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP: TheIncredibleMachine

jobs:
  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc keeps the AppImage portable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --locked --release
      - name: Build AppImage
        run: |
          appdir="$RUNNER_TEMP/AppDir"
          install -Dm755 target/release/tim-bevy "$appdir/usr/bin/tim-bevy"
          install -Dm644 packaging/tim-bevy.desktop "$appdir/usr/share/applications/tim-bevy.desktop"
          install -Dm644 packaging/icon.png "$appdir/usr/share/icons/hicolor/512x512/apps/tim-bevy.png"
          ln -s usr/share/applications/tim-bevy.desktop "$appdir/tim-bevy.desktop"
          ln -s usr/share/icons/hicolor/512x512/apps/tim-bevy.png "$appdir/tim-bevy.png"
          ln -s usr/bin/tim-bevy "$appdir/AppRun"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" "$appdir" "dist/$APP-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "pkg/$env:APP", dist | Out-Null
          Copy-Item target/release/tim-bevy.exe "pkg/$env:APP/$env:APP.exe"
          Compress-Archive -Path "pkg/$env:APP" -DestinationPath "dist/$env:APP-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - run: cargo build --locked --release --target x86_64-apple-darwin
      - name: Build universal app and DMG
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="pkg/The Incredible Machine.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/tim-bevy" \
            target/aarch64-apple-darwin/release/tim-bevy \
            target/x86_64-apple-darwin/release/tim-bevy
          sed "s/VERSION/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z $size $size packaging/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$app"
          ln -s /Applications pkg/Applications
          # hdiutil intermittently fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "The Incredible Machine" -srcfolder pkg -ov -format UDZO \
              "dist/$APP-macos-universal.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*, if-no-files-found: error }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          echo "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f  $RUNNER_TEMP/wasm-bindgen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: bash src/web/build.sh
      - name: Package
        run: |
          mkdir dist
          cp web/TheIncredibleMachine.html "dist/$APP-web.html"
          rm web/TheIncredibleMachine.html
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/*, if-no-files-found: error }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "{linux,windows,macos,web}", merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "The Incredible Machine $GITHUB_REF_NAME" \
            --generate-notes
